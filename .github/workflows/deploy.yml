name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on annule un déploiement en cours s'il est dépassé.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build de la PWA (Vite) -----------------------------------------
      # Produit le bundle statique dans dist/, déployé via rsync.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Les tests unitaires tournent en 300 ms : les passer avant de déployer
      # coûte moins que de mettre en ligne une version cassée. Le build enchaîne
      # `tsc -b`, donc une erreur de type bloque aussi le déploiement.
      - run: npm test

      - run: npm run build   # produit dist/
      # -------------------------------------------------------------------

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"
